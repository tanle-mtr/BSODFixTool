name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build single-file executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name BSODFixTool
          --icon "app/assets/app_icon.ico"
          --add-data "bsod_data.json;."
          --add-data "app/assets;app/assets"
          main.py

      - name: Verify embedded assets
        run: python -m PyInstaller.utils.cliutils.archive_viewer -l dist/BSODFixTool.exe | findstr /i "bsod_data mascot app_icon"

      - name: Offline & dependency self-check
        run: python tools/verify_offline.py

      - name: Primary journey smoke test
        continue-on-error: true
        run: python tools/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: BSODFixTool-windows-x64
          path: dist/BSODFixTool.exe
